<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="description" content="Your focused roadmap to coding interview confidence. Code. Climb. Crex." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/sora-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem("codecrest-preferences");
          const parsed = stored ? JSON.parse(stored) : null;
          const isDark = parsed?.state?.dark ?? window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#0B131B" : "#F7F5F0");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>CodeCrex — Code. Climb. Crex.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
